<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPInvestment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#081426;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold}
.logo span{color:#4d9aff}
nav a{color:white;text-decoration:none;margin-left:18px}
.hero{background:linear-gradient(135deg,#081426,#12315c);color:white;text-align:center;padding:70px 20px}
.hero h1{font-size:40px}
.hero p{max-width:650px;margin:auto;line-height:1.7}
section{padding:55px 6%}
.auth{max-width:450px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px #dce2eb}
input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #d8dee8;border-radius:7px}
button{width:100%;border:0;border-radius:7px;padding:13px;background:#1769e0;color:white;font-weight:bold;cursor:pointer;margin-top:8px}
.message{min-height:25px;line-height:1.5}
#dashboard{display:none}
.box{background:#081426;color:white;padding:30px;border-radius:12px;max-width:700px;margin:auto}
footer{background:#081426;color:white;text-align:center;padding:30px}
</style>
</head>

<body>

<header>
  <div class="logo">UP<span>Investment</span></div>
  <nav>
    <a href="#home">Home</a>
    <a href="#account">Account</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Welcome to UPInvestment</h1>
  <p>Create and securely manage your account.</p>
</section>

<section id="account">

  <div class="auth">

    <h2>Create Account</h2>

    <form id="signupForm">

      <label>Full Name</label>
      <input id="name" type="text" required>

      <label>Email</label>
      <input id="email" type="email" required>

      <label>Password</label>
      <input id="password" type="password" minlength="6" required>

      <button type="submit">Create Account</button>

    </form>

    <p id="signupMessage" class="message"></p>

    <hr>

    <h2>Login</h2>

    <form id="loginForm">

      <label>Email</label>
      <input id="loginEmail" type="email" required>

      <label>Password</label>
      <input id="loginPassword" type="password" required>

      <button type="submit">Login</button>

    </form>

    <p id="loginMessage" class="message"></p>

  </div>

</section>

<section id="dashboard">

  <div class="box">

    <h2>Welcome</h2>

    <p id="userEmail"></p>

    <p>Your account is authenticated through Supabase.</p>

    <button onclick="logout()">Logout</button>

  </div>

</section>

<footer>
  <strong>UPInvestment</strong>
  <p>Investment involves risk. Returns are not guaranteed.</p>
</footer>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://scrjczkluiuwitxbzeud.supabase.co";

const SUPABASE_KEY =
"sb_publishable_83A-4E-xP50UwITDwZ2McQ_oB5hbbP7";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* SIGN UP */

document
.getElementById("signupForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const message =
  document.getElementById("signupMessage");

  message.textContent =
  "Creating account...";

  const name =
  document.getElementById("name").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const { data, error } =
  await supabaseClient.auth.signUp({

    email: email,

    password: password,

    options:{
      data:{
        full_name:name
      }
    }

  });

  if(error){

    message.textContent =
    "Error: " + error.message;

    return;
  }

  if(data.session){

    message.textContent =
    "Account created successfully.";

    showDashboard(data.user);

  }else{

    message.textContent =
    "Account created. Check your email to confirm your account.";

  }

});


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const message =
  document.getElementById("loginMessage");

  message.textContent =
  "Logging in...";

  const email =
  document.getElementById("loginEmail").value.trim();

  const password =
  document.getElementById("loginPassword").value;

  const { data, error } =
  await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

  });

  if(error){

    message.textContent =
    "Error: " + error.message;

    return;
  }

  showDashboard(data.user);

});


/* DASHBOARD */

function showDashboard(user){

  document.getElementById("account")
  .style.display="none";

  document.getElementById("dashboard")
  .style.display="block";

  document.getElementById("userEmail")
  .textContent =
  "Signed in as: " + user.email;

  window.location.hash="dashboard";

}


/* LOGOUT */

async function logout(){

  const { error } =
  await supabaseClient.auth.signOut();

  if(error){

    alert(error.message);

    return;
  }

  document.getElementById("dashboard")
  .style.display="none";

  document.getElementById("account")
  .style.display="block";

  window.location.hash="account";

}


/* RESTORE LOGIN SESSION */

async function checkSession(){

  const { data, error } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    return;
  }

  if(data.session){

    showDashboard(
      data.session.user
    );

  }

}

checkSession();

</script>

</body>
</html>
